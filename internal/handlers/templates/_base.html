{{define "base"}}<!doctype html>
<html
  lang="en"
  {{if
  .Theme}}
  data-theme-server="{{.Theme}}"
  data-theme="{{.Theme}}"
  {{end}}
>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      (function () {
        var html = document.documentElement;
        if (html.getAttribute("data-theme-server")) return;
        var pref = null;
        try {
          pref = localStorage.getItem("theme");
        } catch (e) {}
        var resolved = pref || "auto";
        if (resolved === "auto") {
          resolved = matchMedia("(prefers-color-scheme: light)").matches
            ? "light"
            : "dark";
        }
        html.setAttribute("data-theme", resolved);
      })();
    </script>
    <title>{{block "title" .}}{{.Site.Title}}{{end}}</title>
    {{block "meta" .}}
    <meta property="og:site_name" content="{{.Site.Title}}" />
    <meta property="og:title" content="{{.Site.Title}}" />
    <meta property="og:description" content="{{.Site.Description}}" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    {{end}}
    <link
      rel="icon"
      type="image/svg+xml"
      href="/assets/comma_mascot_logo.svg"
    />
    <link rel="stylesheet" href="/assets/style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"
      crossorigin="anonymous"
    />
    <script src="/assets/htmx.min.js" defer></script>
    <script src="/assets/copy.js" defer></script>
    <script src="/assets/graph.js" defer></script>
    <script src="/assets/reveal.js" defer></script>
    <script
      src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"
      crossorigin="anonymous"
      defer
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"
      defer
    ></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        if (window.katex) {
          document.querySelectorAll(".math-inline").forEach(function (el) {
            var src = el.textContent.replace(/^\$|\$$/g, "");
            try {
              el.innerHTML = katex.renderToString(src, {
                displayMode: false,
                throwOnError: false,
              });
            } catch (e) {}
          });
          document.querySelectorAll(".math-block").forEach(function (el) {
            var src = el.textContent;
            try {
              el.innerHTML = katex.renderToString(src, {
                displayMode: true,
                throwOnError: false,
              });
            } catch (e) {}
          });
        }
        if (window.mermaid) {
          var mt =
            document.documentElement.getAttribute("data-theme") === "light"
              ? "default"
              : "dark";
          mermaid.initialize({ startOnLoad: true, theme: mt });
        }
        // Theme toggle (icon button: flips light <-> dark)
        var tg = document.getElementById("theme-toggle");
        if (tg) {
          var syncIcon = function () {
            var t =
              document.documentElement.getAttribute("data-theme") === "light"
                ? "light"
                : "dark";
            tg.setAttribute("data-theme-current", t);
            tg.setAttribute(
              "aria-label",
              t === "light" ? "切換到夜間" : "切換到日間",
            );
            tg.setAttribute(
              "title",
              t === "light" ? "切換到夜間" : "切換到日間",
            );
          };
          syncIcon();
          tg.addEventListener("click", function () {
            var cur =
              document.documentElement.getAttribute("data-theme") === "light"
                ? "light"
                : "dark";
            var next = cur === "light" ? "dark" : "light";
            document.documentElement.setAttribute("data-theme", next);
            syncIcon();
            try {
              localStorage.setItem("theme", next);
            } catch (e) {}
            try {
              fetch("/settings/theme", {
                method: "POST",
                headers: {
                  "Content-Type": "application/x-www-form-urlencoded",
                },
                body: "theme=" + encodeURIComponent(next),
                credentials: "same-origin",
              });
            } catch (e) {}
          });
        }
      });
    </script>
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <a class="brand" href="/"
          ><img
            src="/assets/comma_mascot_logo.svg"
            class="brand-logo"
            alt="comma mascot"
          /><span>{{.Site.Title}}</span></a
        >
        <nav class="nav">
          <form method="GET" action="/search" class="search-form" role="search">
            <input
              type="search"
              name="q"
              placeholder="搜尋…"
              value="{{.SearchQuery}}"
              aria-label="search"
            />
          </form>
          <button
            type="button"
            id="theme-toggle"
            class="theme-toggle"
            aria-label="切換主題"
          >
            <svg
              class="theme-icon theme-icon-sun"
              viewBox="0 0 24 24"
              width="18"
              height="18"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="4"></circle>
              <path
                d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"
              ></path>
            </svg>
            <svg
              class="theme-icon theme-icon-moon"
              viewBox="0 0 24 24"
              width="18"
              height="18"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>
          {{if .User}}
          <a href="/write">書寫</a>
          <a href="/feed">閱覽</a>
          <a href="/graph">圖譜</a>
          <form method="POST" action="/logout" class="inline-form">
            <button type="submit" class="link-btn">登出</button>
          </form>
          <a
            class="profile-dot"
            href="/{{.User.Handle}}"
            style="background-color:{{avatarColor .User.Handle}}"
            title="@{{.User.Handle}}"
          >
            <img
              class="avatar-img-sm"
              src="{{avatarURL .User.Handle}}"
              alt=""
              onerror="this.remove()"
            />
            <span class="profile-dot-initial"
              >{{avatarInitial .User.Handle}}</span
            >
          </a>
          {{else}}
          <a href="/feed">閱覽</a>
          <a href="/graph">圖譜</a>
          <a href="/login">登入</a>
          {{end}}
        </nav>
      </header>
      <main class="content">{{block "content" .}}{{end}}</main>
    </div>
  </body>
</html>
{{end}}
