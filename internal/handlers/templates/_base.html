{{define "base"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{block "title" .}}{{.Site.Title}}{{end}}</title>
  {{block "meta" .}}
    <meta property="og:site_name" content="{{.Site.Title}}">
    <meta property="og:title" content="{{.Site.Title}}">
    <meta property="og:description" content="{{.Site.Description}}">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary">
  {{end}}
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/copy.js" defer></script>
  <script src="/static/graph.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      if (window.katex) {
        document.querySelectorAll('.math-inline').forEach(function(el) {
          var src = el.textContent.replace(/^\$|\$$/g, '');
          try { el.innerHTML = katex.renderToString(src, {displayMode: false, throwOnError: false}); }
          catch(e) {}
        });
        document.querySelectorAll('.math-block').forEach(function(el) {
          var src = el.textContent;
          try { el.innerHTML = katex.renderToString(src, {displayMode: true, throwOnError: false}); }
          catch(e) {}
        });
      }
      if (window.mermaid) { mermaid.initialize({startOnLoad: true, theme: 'dark'}); }
    });
  </script>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <a class="brand" href="/">{{.Site.Title}}</a>
      <nav class="nav">
        <form method="GET" action="/search" class="search-form" role="search">
          <input type="search" name="q" placeholder="搜尋…" value="{{.SearchQuery}}" aria-label="search">
        </form>
        {{if .User}}
          <a href="/write">write</a>
          <a href="/feed">feed</a>
          <a href="/graph">graph</a>
          <form method="POST" action="/logout" class="inline-form">
            <button type="submit" class="link-btn">logout</button>
          </form>
          <a class="profile-dot" href="/{{.User.Handle}}" style="background-color:{{avatarColor .User.Handle}}" title="@{{.User.Handle}}">{{avatarInitial .User.Handle}}</a>
        {{else}}
          <a href="/feed">feed</a>
          <a href="/graph">graph</a>
          <a href="/login">login</a>
        {{end}}
      </nav>
    </header>
    <main class="content">
      {{block "content" .}}{{end}}
    </main>
  </div>
</body>
</html>
{{end}}
