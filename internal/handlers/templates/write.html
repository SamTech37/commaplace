{{define "title"}}{{if .IsEdit}}Edit{{else}}Write{{end}} ·
{{.Site.Title}}{{end}} {{define "content"}}
<link rel="stylesheet" href="/assets/easymde.min.css" />
<script src="/assets/easymde.min.js" defer></script>
<script src="/assets/cmeditor.js" defer></script>

<div class="editor-page" data-note-id="{{.NoteID}}">
  <div class="editor-bar">
    <span id="save-status" class="save-status" aria-live="polite"></span>
    <button type="button">Upload(todo)</button>
    <button type="button" id="publish-btn" class="publish-btn">
      {{if .Published}}Update{{else}}Publish{{end}}
    </button>
  </div>
  <textarea id="doc">{{.Document}}</textarea>
  <div id="ac-popup" class="ac-popup" hidden>
    <ul></ul>
  </div>
</div>
{{end}}
