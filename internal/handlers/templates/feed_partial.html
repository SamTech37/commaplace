{{define "feed_partial"}}
{{range .Cards}}{{template "masonry_card" .}}{{end}}
{{if .OlderURL -}}
<div id="feed-sentinel" hx-swap-oob="outerHTML"
     class="feed-sentinel"
     hx-get="{{.OlderURL}}"
     hx-trigger="revealed"
     hx-target=".feed-items"
     hx-swap="beforeend">載入更多…</div>
{{- else -}}
<div id="feed-sentinel" hx-swap-oob="outerHTML" class="feed-end">— 沒有更多了 —</div>
{{- end}}
{{end}}
