{{define "title"}}收藏 · {{.Site.Title}}{{end}} {{define "content"}}
<h1>收藏</h1>
<p class="note-meta">你收藏起來稍後再讀的筆記，最新的在前面。</p>
{{if .Items}} {{range .Items}}
<a class="note-card" href="{{.URL}}">
  <div class="note-title">{{.Title}}</div>
  {{if .Excerpt}}
  <div class="note-excerpt">{{.Excerpt}}</div>
  {{end}}
  <div class="note-foot"><span class="meta-handle">@{{.AuthorHandle}}</span> · {{.UpdatedRel}}</div>
</a>
{{end}} {{else}}
<p class="note-meta">還沒有收藏。在筆記頁按「＋ 收藏」即可加入這裡。</p>
{{end}} {{end}}
