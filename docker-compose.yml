services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: commaplace
      POSTGRES_PASSWORD: commaplace
      POSTGRES_DB: commaplace
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commaplace"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
