# Render Blueprint — DESCRIPTIVE ONLY. Nothing currently syncs this file.
#
# As of 2026-08-30 no Blueprint manages the live stack. The one that exists
# (Comma, exs-d95i5au7r5hc73eet4s0) is paused with auto-sync off and owns no
# resources; prod deploys come from the service's own autoDeploy, straight off
# the GitHub webhook. So this file documents what is running — it does not
# provision it.
#
# BEFORE connecting a Blueprint to this repo, read FRESH_START.md. Creating one
# while the names below are taken does NOT adopt those resources: Render's
# creation flow suffixes the copies (comma-c8h6, comma-db-c8h6-c8h6) and then
# bills for a silent parallel stack. That has happened three times.
#
# Two behaviours worth knowing before editing anything here:
#   1. A sync never deletes, it reconciles — deleting a Blueprint-owned resource
#      while auto-sync is on means the next push rebuilds it.
#   2. `name` is the match key and is immutable on an existing resource, so
#      renaming one here reads as "create a new one". It renames nothing.
#
# The 15 GB database disk below holds 10 MB and costs $4.38/mo. Render cannot
# shrink a disk, so the fix is a rebuild, not an edit — FRESH_START.md.
services:
  - name: comma
    type: web
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    # Push to main ships it. This defaults off in the dashboard, which is why a
    # merged migration sat on main doing nothing until someone deployed by hand.
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: comma-db-c8h6
          property: connectionString
      # Render assigns a dynamic PORT by default; pin both sides instead of
      # relying on dynamic interpolation (Blueprint spec has no clean way to
      # feed Render's own injected PORT back into ADDR).
      - key: PORT
        value: "10000"
      - key: ADDR
        value: ":10000"
      - key: SESSION_SECRET
        generateValue: true
      - key: SEED_DEV
        value: "0"
      # Public origin. Google OAuth derives its redirect URI from this
      # (BASE_URL + /auth/google/callback), and Google compares the host
      # literally — "www." counts, and no trailing slash. Apex is canonical
      # (www 301s to it), but the value below stays on www because that is
      # what the Console currently has registered. To move to the apex,
      # register https://commaplace.app/auth/google/callback first.
      #
      # Live prod has this without the scheme, set by hand in the dashboard.
      # The scheme is required — a scheme-less value broke Google OAuth in
      # August; loadConfig now repairs it at boot.
      - key: BASE_URL
        value: https://www.commaplace.app
      # Google OAuth. The client ID is public (it ships in the consent-page
      # redirect the browser follows); the secret never lands in git — set it
      # once in Render, and the "Continue with Google" button appears as soon
      # as both are present. This value is the one live in prod as of
      # 2026-08-13 — an out-of-date one here silently swaps the OAuth client
      # on the next Blueprint apply.
      - key: GOOGLE_CLIENT_ID
        value: 826692770873-gvmbdlsltemcgh0aie4jtra1jhu1f91e.apps.googleusercontent.com
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Optional — your handle, lower-case, to unlock /admin/reports.
      - key: ADMIN_HANDLE
        sync: false
      # Shared secret for /_dev/login?as=<handle>&key=<this> — the no-SMTP
      # stopgap login for playtesters. DEBUG stays unset/off on purpose.
      - key: PLAYTEST_LOGIN_KEY
        sync: false

databases:
  # The suffix is not a typo — the live database is named comma-db-c8h6. It was
  # born suffixed because `comma-db` was taken at creation, and a database name
  # cannot be changed afterwards.
  - name: comma-db-c8h6
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "17"
    # Deliberately NOT declaring diskSizeGB. The live disk is 15 GB; a Blueprint
    # cannot shrink it, and naming a smaller number here would be a lie that
    # never takes effect. FRESH_START.md covers replacing it with a 1 GB disk.
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere
