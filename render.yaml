# Render Blueprint — infra for the live deploy.
#
# NEVER "New + → Blueprint" again. That creates a *second* Blueprint record
# instead of syncing the existing one; the names below are already taken, so
# Render silently suffixes the copies (comma-c8h6, comma-db-c8h6) and bills
# for both. It has happened three times — see the deleted comma-c8h6 that ran
# 156 hours. To apply a change: push to main, or hit Sync on the existing
# Blueprint in the dashboard.
#
# Plans are pinned. Leaving "plan" unset makes Render pick at apply-time, so a
# stray apply came up on a different instance type than prod. Changing a value
# here changes the bill on the next sync.
services:
  - name: comma
    type: web
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    # Push to main ships it. This defaults off in the dashboard, which is why a
    # merged migration sat on main doing nothing until someone deployed by hand.
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          # Must match the databases: name below exactly, suffix and all.
          name: comma-db-c8h6
          property: connectionString
      # Render assigns a dynamic PORT by default; pin both sides instead of
      # relying on dynamic interpolation (Blueprint spec has no clean way to
      # feed Render's own injected PORT back into ADDR).
      - key: PORT
        value: "10000"
      - key: ADDR
        value: ":10000"
      - key: SESSION_SECRET
        generateValue: true
      - key: SEED_DEV
        value: "0"
      # Public origin. Google OAuth derives its redirect URI from this
      # (BASE_URL + /auth/google/callback), and Google compares the host
      # literally — "www." counts, and no trailing slash. Apex is canonical
      # (www 301s to it), but the value below stays on www because that is
      # what the Console currently has registered. To move to the apex,
      # register https://commaplace.app/auth/google/callback first.
      - key: BASE_URL
        value: https://www.commaplace.app
      # Google OAuth. The client ID is public (it ships in the consent-page
      # redirect the browser follows); the secret never lands in git — set it
      # once in Render, and the "Continue with Google" button appears as soon
      # as both are present. This value is the one live in prod as of
      # 2026-08-13 — an out-of-date one here silently swaps the OAuth client
      # on the next Blueprint apply.
      - key: GOOGLE_CLIENT_ID
        value: 826692770873-gvmbdlsltemcgh0aie4jtra1jhu1f91e.apps.googleusercontent.com
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Optional — your handle, lower-case, to unlock /admin/reports.
      - key: ADMIN_HANDLE
        sync: false
      # Shared secret for /_dev/login?as=<handle>&key=<this> — the no-SMTP
      # stopgap login for playtesters. DEBUG stays unset/off on purpose.
      - key: PLAYTEST_LOGIN_KEY
        sync: false

databases:
  # The suffix is not a typo. The live database is literally named
  # comma-db-c8h6, and a database name is immutable on Render. While this said
  # "comma-db" the Blueprint matched nothing, so every sync planned to CREATE a
  # database instead of adopting the running one:
  #   render blueprints validate  →  plan.databases: [comma-db], totalActions: 3
  #   with the name below         →  totalActions: 1
  - name: comma-db-c8h6
    plan: basic-256mb
    postgresMajorVersion: "17"
    # diskSizeGB is deliberately unset: the live DB was provisioned at 15GB
    # (~$4.4/mo for near-zero data) and Render cannot shrink a disk in place.
    # Fixing that means a new database + dump/restore, not an edit here.
